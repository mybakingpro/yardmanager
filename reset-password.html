<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – Yard Manager Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: #fff;
      border: 3px solid #e08a00;
      border-radius: 4px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 6px;
    }

    .logo span { color: #e08a00; }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 32px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #f5f0e8;
      border: none;
      border-radius: 3px;
      font-size: 15px;
      color: #111;
      margin-bottom: 16px;
      outline: none;
      transition: box-shadow 0.2s;
    }

    input:focus { box-shadow: 0 0 0 2px #e08a00; }

    button {
      width: 100%;
      padding: 16px;
      background: #e08a00;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    button:hover { background: #c97a00; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    .msg {
      margin-top: 18px;
      font-size: 13px;
      min-height: 20px;
    }

    .msg.error { color: #c0392b; }
    .msg.success { color: #27ae60; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Yard Manager <span>Pro</span></div>
    <div class="subtitle">Truck Yard Payment System</div>

    <label for="password">New Password</label>
    <input type="password" id="password" placeholder="Enter new password" />

    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Confirm new password" />

    <button id="btn" onclick="resetPassword()">Set New Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // ── Paste your Supabase project URL and anon key here ──
    const SUPABASE_URL = 'https://eirygyqskplctayrnvjd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcnlneXFza3BsY3RheXJudmpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTEyMTQsImV4cCI6MjA5MjgyNzIxNH0.gafTmmgL70XK_aMKYcar_pvT1ra76OP95WuR2bWl20o';
    // ───────────────────────────────────────────────────────

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Supabase puts the token in the URL hash on recovery links
    // This call picks it up automatically
    client.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Session is ready — user can now set a new password
        document.getElementById('msg').textContent = '';
      }
    });

    async function resetPassword() {
      const password = document.getElementById('password').value.trim();
      const confirm  = document.getElementById('confirm').value.trim();
      const msg      = document.getElementById('msg');
      const btn      = document.getElementById('btn');

      msg.className = 'msg';
      msg.textContent = '';

      if (!password || !confirm) {
        msg.className = 'msg error';
        msg.textContent = 'Please fill in both fields.';
        return;
      }

      if (password !== confirm) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      if (password.length < 6) {
        msg.className = 'msg error';
        msg.textContent = 'Password must be at least 6 characters.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        msg.className = 'msg error';
        msg.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      } else {
        msg.className = 'msg success';
        msg.textContent = '✓ Password updated! Redirecting to login...';
        setTimeout(() => { window.location.href = '/yardmanager'; }, 2000);
      }
    }
  </script>
</body>
</html>
